<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}knowb.run{% endblock title %}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif'],
                        arcade: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif'],
                        wordmark: ['Audiowide', 'Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        'autumn-fire': '#FF4A1A',
                        'deep-rust': '#8E2F2A',
                        'soft-ember': '#F59A52',
                        'paper-ivory': '#FCF6F3',
                        'saber-blue': '#86E8FF',
                        'charcoal-bark': '#7A2217',
                        'muted-wood': '#77584F',
                        'terracotta-border': '#E9C2B3',
                        'gold-primary': '#FFD500',
                        'gold-attention': '#FFB300',
                        'gold-secondary': '#F7C700',
                        'gold-highlight': '#FFC61A',
                        'gold-muted': '#F2C14E',
                        'gold-midnight': '#15163D',
                        'gold-indigo': '#1E2259',
                        'gold-purple': '#2D1F5B',
                        'gold-plum': '#221338',
                    },
                    backgroundImage: {
                        'fire-rust': 'linear-gradient(135deg, #FF4A1A 0%, #8E2F2A 100%)',
                        'rust-charcoal': 'linear-gradient(180deg, #8E2F2A 0%, #7A2217 100%)',
                        'ember-fire': 'linear-gradient(145deg, #F59A52 0%, #FF4A1A 100%)',
                        'ember-glow': 'linear-gradient(135deg, rgba(255,74,26,0.82) 0%, rgba(142,47,42,0.74) 44%, rgba(134,232,255,0.86) 100%)',
                        'ivory-rust-edge': 'linear-gradient(90deg, #FCF6F3 0%, #8E2F2A 8%, #86E8FF 16%, #FCF6F3 100%)',
                        'knowb-autumn-core': 'linear-gradient(132deg, #FF4A1A 0%, #8E2F2A 34%, #7A2217 72%, #86E8FF 100%)',
                        'knowb-autumn-vertical': 'linear-gradient(180deg, #8E2F2A 0%, #7A2217 35%, #FF4A1A 100%)',
                        'gold-command-depth': 'linear-gradient(135deg, #1E2259 0%, #15163D 100%)',
                        'gold-deep-cockpit': 'linear-gradient(180deg, #2D1F5B 0%, #221338 100%)',
                        'gold-signal': 'linear-gradient(135deg, #FFD500 0%, #FFB300 100%)',
                    },
                    boxShadow: {
                        'ember-glow': '0 0 30px rgba(134,232,255,0.30)',
                        'fire-glow': '0 0 25px rgba(255,74,26,0.22)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/global.css?v=rfp-featured-chips">
    {% block head_extra %}{% endblock head_extra %}
</head>
    <body class="min-h-screen font-sans bg-charcoal-bark text-paper-ivory">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:px-4 focus:py-2 focus:bg-soft-ember focus:text-charcoal-bark focus:rounded-md focus:font-semibold">
        Skip to main content
    </a>

    <div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>
    {% block header %}{% endblock header %}

    {% block content %}{% endblock content %}

    {% block footer %}{% endblock footer %}
    {% block scripts %}{% endblock scripts %}
</body>
</html>
