<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KnowB Diagram Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FCF6F3;
      --ink: #7A2217;
      --muted: #77584F;
      --rule: rgba(122, 34, 23, 0.16);
      --accent: #8E2F2A;
      --accent-tint: rgba(142, 47, 42, 0.08);
      --signal: #86E8FF;
      --sans: Inter, system-ui, sans-serif;
      --display: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 3rem 1.5rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: min(100%, 1200px); margin: 0 auto; }
    .eyebrow { margin: 0 0 0.5rem; color: var(--muted); font: 500 0.68rem/1.4 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { margin: 0 0 1.5rem; font: 600 clamp(1.6rem, 2.4vw + 0.8rem, 2.4rem)/1.1 var(--display); letter-spacing: -0.03em; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 880px; height: auto; }
    @media (max-width: 640px) { body { padding: 1.5rem 1rem; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">[Diagram Type] · KnowB AI Systems</p>
    <h1>[Diagram title]</h1>
    <div class="scroll">
      <svg viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description" xmlns="http://www.w3.org/2000/svg">
        <title id="diagram-title">[Diagram title]</title>
        <desc id="diagram-description">Replace this description with the essential relationship shown by the diagram.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#77584F"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8E2F2A"/></marker>
          <marker id="arrow-signal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#7A2217"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#FCF6F3"/>
        <!-- Draw connectors first. Keep elbows orthogonal, labels masked, and the accent to one or two focal relationships. -->
        <!-- Draw node masks before their visible node box so connectors never bleed through. -->
        <!-- Use only the semantic roles defined in design-system/diagram-design/references/style-guide.md. -->
      </svg>
    </div>
  </main>
</body>
</html>
