<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KnowB AI Systems Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #7A2217;
      --paper-2: #8E2F2A;
      --ink: #FCF6F3;
      --muted: #E9C2B3;
      --soft: #F59A52;
      --rule: rgba(252, 246, 243, 0.18);
      --accent: #F59A52;
      --accent-tint: rgba(245, 154, 82, 0.12);
      --signal: #86E8FF;
      --sans: Inter, system-ui, sans-serif;
      --display: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: min(100%, 1320px); margin: 0 auto; padding: 3rem 1.5rem; }
    .eyebrow { margin: 0 0 0.5rem; color: var(--signal); font: 500 0.68rem/1.4 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { max-width: 46rem; margin: 0 0 0.7rem; color: var(--ink); font: 600 clamp(1.7rem, 2.4vw + 0.9rem, 2.5rem)/1.1 var(--display); letter-spacing: -0.035em; }
    .lede { max-width: 48rem; margin: 0 0 2rem; color: var(--muted); font-size: 1rem; line-height: 1.55; }
    .scroll { overflow-x: auto; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
    svg { display: block; width: 100%; min-width: 980px; height: auto; }
    @media (max-width: 640px) { main { padding: 1.5rem 1rem; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Architecture · KnowB Diagram System</p>
    <h1>KnowB AI Systems, a reference map</h1>
    <p class="lede">A small, evidence-aware system boundary: a verified operator uses a KnowB surface, a knowledge agent connects bounded sources, and private organisational material remains inside a protected vault.</p>

    <div class="scroll">
      <svg viewBox="0 0 1200 660" role="img" aria-labelledby="map-title map-description" xmlns="http://www.w3.org/2000/svg">
        <title id="map-title">KnowB AI Systems reference architecture</title>
        <desc id="map-description">A verified operator reaches a KnowB surface, which routes work to a knowledge agent. The agent reads a context index and a private design asset vault, then returns an evidence-linked result.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#E9C2B3"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F59A52"/></marker>
          <marker id="arrow-signal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#86E8FF"/></marker>
        </defs>

        <rect width="1200" height="660" fill="#7A2217"/>

        <rect x="824" y="96" width="320" height="392" rx="8" fill="rgba(252,246,243,0.03)" stroke="rgba(134,232,255,0.62)" stroke-width="1" stroke-dasharray="5 4"/>
        <rect x="848" y="88" width="192" height="20" rx="4" fill="#7A2217"/>
        <text x="864" y="102" fill="#86E8FF" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.13em">PROTECTED ORGANISATIONAL DATA</text>

        <!-- Connectors first. -->
        <line x1="232" y1="296" x2="320" y2="296" stroke="#86E8FF" stroke-width="1.25" marker-end="url(#arrow-signal)"/>
        <line x1="520" y1="296" x2="616" y2="296" stroke="#F59A52" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 840 272 H 916 Q 924 272 924 264 V 228" fill="none" stroke="#E9C2B3" stroke-width="1.15" marker-end="url(#arrow)"/>
        <path d="M 840 320 H 916 Q 924 320 924 328 V 396" fill="none" stroke="#86E8FF" stroke-width="1.2" marker-end="url(#arrow-signal)"/>
        <path d="M 616 320 H 560 Q 552 320 552 328 V 432 Q 552 440 544 440 H 320" fill="none" stroke="#E9C2B3" stroke-width="1.05" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
        <path d="M 320 464 H 232" fill="none" stroke="#E9C2B3" stroke-width="1.05" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

        <!-- Connector labels keep a visible gap from their path. -->
        <rect x="248" y="272" width="56" height="14" rx="2" fill="#7A2217"/>
        <text x="276" y="282" fill="#86E8FF" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OAUTH</text>
        <rect x="536" y="272" width="64" height="14" rx="2" fill="#7A2217"/>
        <text x="568" y="282" fill="#F59A52" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE</text>
        <rect x="852" y="240" width="56" height="14" rx="2" fill="#7A2217"/>
        <text x="880" y="250" fill="#E9C2B3" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECALL</text>
        <rect x="852" y="340" width="72" height="14" rx="2" fill="#7A2217"/>
        <text x="888" y="350" fill="#86E8FF" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ ONLY</text>
        <rect x="396" y="410" width="116" height="14" rx="2" fill="#7A2217"/>
        <text x="454" y="420" fill="#E9C2B3" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVIDENCE-LINKED</text>

        <!-- Verified operator. -->
        <rect x="56" y="256" width="176" height="80" rx="6" fill="#7A2217"/>
        <rect x="56" y="256" width="176" height="80" rx="6" fill="rgba(233,194,179,0.08)" stroke="#E9C2B3" stroke-width="1"/>
        <rect x="68" y="268" width="42" height="14" rx="2" fill="transparent" stroke="rgba(233,194,179,0.55)" stroke-width="0.8"/>
        <text x="89" y="278" fill="#E9C2B3" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.09em">HUMAN</text>
        <text x="144" y="302" fill="#FCF6F3" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Verified operator</text>
        <text x="144" y="320" fill="#E9C2B3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">EU-facing access</text>

        <!-- Surface. -->
        <rect x="320" y="256" width="200" height="80" rx="6" fill="#7A2217"/>
        <rect x="320" y="256" width="200" height="80" rx="6" fill="rgba(252,246,243,0.03)" stroke="#FCF6F3" stroke-width="1"/>
        <rect x="332" y="268" width="38" height="14" rx="2" fill="transparent" stroke="rgba(252,246,243,0.48)" stroke-width="0.8"/>
        <text x="351" y="278" fill="#E9C2B3" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.09em">SURF</text>
        <text x="420" y="302" fill="#FCF6F3" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">KnowB surface</text>
        <text x="420" y="320" fill="#E9C2B3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">web · CLI · MCP</text>

        <!-- Knowledge agent, focal. -->
        <rect x="616" y="248" width="224" height="96" rx="8" fill="#7A2217"/>
        <rect x="616" y="248" width="224" height="96" rx="8" fill="rgba(245,154,82,0.12)" stroke="#F59A52" stroke-width="1.2"/>
        <rect x="628" y="260" width="42" height="14" rx="2" fill="transparent" stroke="rgba(245,154,82,0.68)" stroke-width="0.8"/>
        <text x="649" y="270" fill="#F59A52" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.09em">AGENT</text>
        <text x="728" y="302" fill="#FCF6F3" font-size="15" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Knowledge agent</text>
        <text x="728" y="322" fill="#F59A52" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">bounded tools · auditable output</text>

        <!-- Context index. -->
        <rect x="924" y="148" width="184" height="80" rx="6" fill="#7A2217"/>
        <rect x="924" y="148" width="184" height="80" rx="6" fill="rgba(252,246,243,0.06)" stroke="#E9C2B3" stroke-width="1"/>
        <rect x="936" y="160" width="40" height="14" rx="2" fill="transparent" stroke="rgba(233,194,179,0.55)" stroke-width="0.8"/>
        <text x="956" y="170" fill="#E9C2B3" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.09em">INDEX</text>
        <text x="1016" y="194" fill="#FCF6F3" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Context index</text>
        <text x="1016" y="212" fill="#E9C2B3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">registry · knowledgeHQ</text>

        <!-- Private design vault. -->
        <rect x="924" y="396" width="184" height="80" rx="6" fill="#7A2217"/>
        <rect x="924" y="396" width="184" height="80" rx="6" fill="rgba(134,232,255,0.08)" stroke="#86E8FF" stroke-width="1"/>
        <rect x="936" y="408" width="42" height="14" rx="2" fill="transparent" stroke="rgba(134,232,255,0.65)" stroke-width="0.8"/>
        <text x="957" y="418" fill="#86E8FF" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.09em">VAULT</text>
        <text x="1016" y="442" fill="#FCF6F3" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Design asset vault</text>
        <text x="1016" y="460" fill="#86E8FF" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">private Google Drive folder</text>

        <!-- Result node. -->
        <rect x="320" y="424" width="224" height="80" rx="6" fill="#7A2217"/>
        <rect x="320" y="424" width="224" height="80" rx="6" fill="rgba(252,246,243,0.03)" stroke="#FCF6F3" stroke-width="1"/>
        <rect x="332" y="436" width="38" height="14" rx="2" fill="transparent" stroke="rgba(252,246,243,0.48)" stroke-width="0.8"/>
        <text x="351" y="446" fill="#E9C2B3" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.09em">OUT</text>
        <text x="432" y="470" fill="#FCF6F3" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Evidence-linked result</text>
        <text x="432" y="488" fill="#E9C2B3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">report · decision · next action</text>

        <!-- Legend. -->
        <line x1="56" y1="556" x2="1144" y2="556" stroke="rgba(252,246,243,0.18)" stroke-width="0.8"/>
        <text x="56" y="582" fill="#E9C2B3" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.16em">LEGEND</text>
        <rect x="160" y="570" width="18" height="12" rx="2" fill="rgba(245,154,82,0.12)" stroke="#F59A52" stroke-width="1"/>
        <text x="188" y="580" fill="#E9C2B3" font-size="9" font-family="Inter, sans-serif">Focal agent</text>
        <line x1="320" y1="576" x2="348" y2="576" stroke="#86E8FF" stroke-width="1.2" marker-end="url(#arrow-signal)"/>
        <text x="358" y="580" fill="#E9C2B3" font-size="9" font-family="Inter, sans-serif">Verified / protected path</text>
        <line x1="560" y1="576" x2="588" y2="576" stroke="#E9C2B3" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
        <text x="598" y="580" fill="#E9C2B3" font-size="9" font-family="Inter, sans-serif">Evidence return</text>
      </svg>
    </div>
  </main>
</body>
</html>
