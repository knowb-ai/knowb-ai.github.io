[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowb-org-index"
version = "0.2.0"
description = "Local-first MCP directory and GitHub work control plane for KnowB AI projects"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "mcp>=2.0,<3.0",
  "PyYAML>=6.0,<7.0"
]

[project.scripts]
knowb-org = "knowb_org_index.cli:main"
knowb-org-mcp = "knowb_org_index.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowb_org_index"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
  "/hatch_build.py",
  "/src/knowb_org_index/**",
  "/okf-bridge/**",
  "/docs/**",
  "/scripts/**",
]
exclude = [
  "/okf-bridge/target/**",
  "/dist/**",
  "/.venv/**",
  "/tests/**",
]

[tool.uv]
package = true
