[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowb-org-index"
version = "0.1.0"
description = "Local-first MCP directory and GitHub work control plane for KnowB AI projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.0,<3.0",
  "PyYAML>=6.0,<7.0"
]

[project.scripts]
knowb-org = "knowb_org_index.cli:main"
knowb-org-mcp = "knowb_org_index.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowb_org_index"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "hatch_build.py",
  "pyproject.toml",
  "README.md",
  "src/knowb_org_index",
  "okf-bridge/Cargo.toml",
  "okf-bridge/Cargo.lock",
  "okf-bridge/src/main.rs",
  "tests",
  "docs",
  "licenses",
]

[tool.uv]
package = true
